name: Build Windows Standalone EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --config Release

      - name: Deploy Windows Binary with windeployqt
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\MahadevRiceMillERP
          copy build\MahadevRiceMillERP.exe dist\MahadevRiceMillERP\
          
          REM Copy local QML folder & Database template into distribution folder
          xcopy qml dist\MahadevRiceMillERP\qml\ /E /I /Y
          copy mahadev_accounting.db dist\MahadevRiceMillERP\
          
          REM Deploy Qt runtime plugins and compiler runtime
          windeployqt --qmldir qml --release --compiler-runtime --no-translations dist\MahadevRiceMillERP\MahadevRiceMillERP.exe

      - name: Copy MSVC CRT DLLs
        shell: powershell
        run: |
          if ($env:VCToolsRedistDir) {
            $crtDir = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $crtDir) {
              Write-Host "Copying MSVC CRT from: $crtDir"
              Copy-Item "$crtDir\*.dll" -Destination "dist\MahadevRiceMillERP\" -Force
            }
          }

      - name: Package Portable Zip
        shell: powershell
        run: |
          cd dist
          tar -a -c -f "MahadevRiceMill-Windows-x64.zip" MahadevRiceMillERP

      - name: Upload Windows Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: MahadevRiceMill-Windows-x64
          path: dist/MahadevRiceMill-Windows-x64.zip
