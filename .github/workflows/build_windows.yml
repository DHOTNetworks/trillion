name: Build Windows Standalone EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --config Release

      - name: Deploy Windows Binary with windeployqt
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\app
          copy build\MahadevRiceMillERP.exe dist\app\
          windeployqt --qmldir qml --release --compiler-runtime --no-translations dist\app\MahadevRiceMillERP.exe

      - name: Copy MSVC CRT DLLs
        shell: powershell
        run: |
          if ($env:VCToolsRedistDir) {
            $crtDir = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $crtDir) {
              Write-Host "Copying MSVC CRT from: $crtDir"
              Copy-Item "$crtDir\*.dll" -Destination "dist\app\" -Force
            }
          }

      - name: Package Single Portable Self-Contained EXE
        shell: powershell
        run: |
          choco install 7zip.commandline -y
          
          # Write SFX config file using standard Set-Content with indentation preserved
          @'
          ;!@Install@!UTF-8!
          Title="Mahadev Rice Mill Accounting ERP"
          ExecuteFile="MahadevRiceMillERP.exe"
          ;!@InstallEnd@!
          '@ | Out-File -FilePath "dist\config.txt" -Encoding ascii
          
          # Download 7z SFX module
          Invoke-WebRequest -Uri "https://github.com/chrislake/7zsfxmm/releases/download/1.7.0.3900/7zsd_All.sfx" -OutFile "dist\7zsd.sfx" -UseBasicParsing
          
          cd dist\app
          7za a -r -mx9 ..\app_payload.7z *
          cd ..\..
          
          # Combine into Single Standalone Executable
          cmd /c "copy /b dist\7zsd.sfx + dist\config.txt + dist\app_payload.7z dist\MahadevRiceMillERP_SingleFile.exe"
          
          # Also package portable zip
          cd dist
          tar -a -c -f "MahadevRiceMill-Windows-Portable.zip" app

      - name: Upload Single Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: MahadevRiceMillERP-SingleFile-EXE
          path: dist/MahadevRiceMillERP_SingleFile.exe

      - name: Upload Portable Zip Folder
        uses: actions/upload-artifact@v4
        with:
          name: MahadevRiceMill-Windows-Portable-Folder
          path: dist/MahadevRiceMill-Windows-Portable.zip
