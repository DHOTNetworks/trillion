name: Build Windows Standalone EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --config Release

      - name: Deploy Windows Binary with windeployqt
        shell: cmd
        run: |
          mkdir dist
          copy build\MahadevRiceMillERP.exe dist\
          windeployqt --qmldir qml --release dist\MahadevRiceMillERP.exe

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahadevRiceMill-Windows-x64
          path: dist/
