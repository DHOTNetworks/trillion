name: Multi-Platform Cross-Compilation & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            qt_arch: clang_64
            artifact_name: MahadevRiceMill-macOS-arm64
          - os: windows-2022
            platform: windows-x64
            qt_arch: win64_msvc2022_64
            artifact_name: MahadevRiceMill-Windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
            qt_arch: gcc_64
            artifact_name: MahadevRiceMill-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: ${{ matrix.qt_arch }}
          archives: 'qtbase qtdeclarative qttools'
          cache: true

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---------------- Linux specific setup ----------------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libx11-dev libx11-xcb-dev

      # ---------------- Build Steps ----------------
      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compile Application
        run: |
          cmake --build build --config Release

      # ---------------- Packaging macOS ----------------
      - name: Package macOS App
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          macdeployqt build/MahadevRiceMillERP.app -qmldir=qml || true
          cd build && zip -r "../dist/${{ matrix.artifact_name }}.app.zip" "MahadevRiceMillERP.app"

      # ---------------- Packaging Windows ----------------
      - name: Package Windows Portable Executable & DLLs
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\MahadevRiceMillERP
          copy build\MahadevRiceMillERP.exe dist\MahadevRiceMillERP\
          windeployqt --qmldir qml --release dist\MahadevRiceMillERP\MahadevRiceMillERP.exe
          cd dist
          tar -a -c -f "${{ matrix.artifact_name }}.zip" MahadevRiceMillERP

      # ---------------- Packaging Linux ----------------
      - name: Package Linux Standalone Bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/MahadevRiceMillERP
          cp build/MahadevRiceMillERP dist/MahadevRiceMillERP/
          cd dist && tar -czvf "${{ matrix.artifact_name }}.tar.gz" MahadevRiceMillERP

      # ---------------- Upload Artifacts ----------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
